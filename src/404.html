<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var basePath = '/portifolio_vinicius/';
      var route = window.location.pathname.indexOf(basePath) === 0
        ? window.location.pathname.slice(basePath.length)
        : '';
      route += window.location.search + window.location.hash;
      window.location.replace(basePath + '?__ghpages_route=' + encodeURIComponent(route));
    })();
  </script>
  <title>Redirecionando…</title>
</head>
<body>
  <p>Redirecionando para o portfólio…</p>
</body>
</html>
