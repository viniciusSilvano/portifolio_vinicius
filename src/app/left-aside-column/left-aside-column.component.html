<aside class="social-links-bottom" aria-label="Redes sociais">
  @for (button of buttons; track button) {
    <a href="{{button.mediaUrl}}" target="_blank" rel="noopener noreferrer" [attr.aria-label]="button.alt" [title]="button.alt">
      <span class="social-links-bottom__button" [ngStyle]="{ 'background-image': 'url(' + button.source + ')'}" aria-hidden="true"></span>
    </a>
  }
</aside>
