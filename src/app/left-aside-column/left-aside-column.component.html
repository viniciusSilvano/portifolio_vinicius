<aside >
  <div  class="btn-group" role="group" aria-label="Medias sociais">
    @for (button of buttons; track button) {
      <a  href="{{button.mediaUrl}}" target="_blank">
        <button  title="{{button.alt}}" class="btn btn-secondary mx-1 my-3 h-25 w-25 p-4 btnRedeSocial" type="button"
          [ngStyle]="{ 'background-image': 'url(' + button.source + ')'}">
        </button>
      </a>
    }
  </div>
</aside>
