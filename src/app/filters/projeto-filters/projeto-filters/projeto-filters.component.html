<section class="filter-search">
  <h2>Procurar projeto</h2>

  <fieldset class="filter-search__section">
    <legend>Por dados do projeto</legend>
    <label for="searchInput">Buscar pelo nome do projeto</label>
    <input #mySearch id="searchInput" class="form-control" placeholder="Ex.: portfólio" name="searchInput" type="search" (input)="filterByItem(mySearch.value)">
  </fieldset>

  <fieldset class="filter-search__section">
    <legend>Por tag do projeto</legend>
    <small class="filter-search__hint">Selecione uma ou mais tags para filtrar.</small>
    <div class="filter-search__tags">
      @for (tag of todasTags; track tag) {
        <button type="button" class="filter-search__tag clickable"
          [ngClass]="{'is-selected': tagSelecionadaParaFiltro(tag)}"
          (click)="OnClickSearchByTag(tag)" [attr.aria-pressed]="tagSelecionadaParaFiltro(tag)">
          {{tag.nome}}
        </button>
      }
    </div>
  </fieldset>

  @if (tecnologiasParaBusca.length > 0) {
    <fieldset class="filter-search__section">
      <legend>Por tecnologia</legend>
      <small class="filter-search__hint">Selecione uma tecnologia para filtrar.</small>
      <div class="filter-search__technologies">
        @for (tecnologia of tecnologiasParaBusca; track tecnologia) {
          <div class="filter-search__technology">
            <app-custom-card-tecnologia [tecnologia]="tecnologia" [projetoFilter]="projetoFilter" (onClick)="OnClickSearchByTecnologyImage($event)"></app-custom-card-tecnologia>
          </div>
        }
      </div>
    </fieldset>
  }
</section>
