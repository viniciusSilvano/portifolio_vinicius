<nav class="breadcrumbContainer">
  <a routerLink="/projeto">Projetos</a><span>/</span><span>Detalhes</span>
</nav>
@if (projetoEspecificacao) {
  <section class="project-details">
    <h1 class="project-details__title"><span [innerHTML]="getTituloProjeto()"></span></h1>
    @if(versaoWrapper){
      <aside class="filter-search__tags mb-2">
        @for(versao of versaoWrapper?.versoes; track versao){
          <div [class.is-selected]="versao.versao.nome === projetoEspecificacao.nomeVersao"  class="filter-search__tag">{{versao.versao.nome}}</div>
        }
      </aside>
    }
    <div class="project-details__slider">
      <app-image-slider [slides]="projetoEspecificacao.imagens"></app-image-slider>
    </div>
    <div class="project-details__accordions">
      @for (accordionCard of projetoEspecificacao.accordionCards; track accordionCard) {
        <app-accordion-projeto-card [accordionCard]="accordionCard"></app-accordion-projeto-card>
      }
    </div>
    <div class="project-details__footer">
      <button (click)="getBack()" class="btn btn-outline-light" type="button"><i class="bi bi-arrow-left me-2"></i>Voltar aos projetos</button>
    </div>
  </section>
}
